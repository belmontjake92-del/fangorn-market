<svg width="128" height="128" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fangorn Market mark: an Ent/tree that is also an upward market graph. -->
  <g stroke="#c6f24e" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- trunk -->
    <path d="M32 58V27" />
    <!-- lower branches -->
    <path d="M32 45 L21 35" />
    <path d="M32 45 L42 36" />
    <!-- upper branches -->
    <path d="M32 30 L25 21" />
    <path d="M32 30 L43 19" />
    <!-- growth branch, sweeping up-right like a rising chart -->
    <path d="M43 19 L52 9" />
  </g>
  <!-- nodes: the living-graph vertices -->
  <g fill="#c6f24e">
    <circle cx="21" cy="35" r="2.6" />
    <circle cx="42" cy="36" r="2.6" />
    <circle cx="25" cy="21" r="2.6" />
    <circle cx="43" cy="19" r="2.6" />
  </g>
  <!-- the market high -->
  <circle cx="52" cy="9" r="4" fill="#d4f76a" />
</svg>
