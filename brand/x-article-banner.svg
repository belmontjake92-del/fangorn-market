    <path d="M1400 500 L1300 415"/>
    <path d="M1400 500 L1515 435"/>
    <path d="M1400 400 L1320 300"/>
    <path d="M1400 400 L1545 320"/>
    <path d="M1545 320 L1670 215"/>
    <path d="M1670 215 L1810 145"/>
    <path d="M1810 145 L1935 185"/>
  </g>
  <g fill="#c6f24e" opacity="0.6">
    <circle cx="1300" cy="415" r="5"/>
    <circle cx="1515" cy="435" r="5"/>
    <circle cx="1320" cy="300" r="5"/>
    <circle cx="1545" cy="320" r="6"/>
    <circle cx="1670" cy="215" r="6"/>
    <circle cx="1935" cy="185" r="6"/>
  </g>
  <circle cx="1810" cy="145" r="10" fill="#d4f76a"/>

