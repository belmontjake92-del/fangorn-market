      <stop offset="1" stop-color="#0b1109"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#c6f24e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c6f24e" stop-opacity="0"/>
