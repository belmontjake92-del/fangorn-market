  <!-- wordmark -->
  <text x="470" y="405" font-family="'Playfair Display', Georgia, serif" font-size="128" font-weight="700" fill="#fafafa">Fangorn <tspan fill="#c6f24e" font-style="italic">Market</tspan></text>

  <!-- tagline -->
  <text x="476" y="478" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="40" fill="#d8d8dc">Build smarter agents. Trade proven intelligence.</text>
