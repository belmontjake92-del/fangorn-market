  </g>
  <circle cx="1910" cy="120" r="11" fill="#d4f76a"/>

  <!-- small logo lockup, top-left -->
  <g transform="translate(100,86) scale(1.5)">
    <g stroke="#c6f24e" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 58V27"/><path d="M32 45 L21 35"/><path d="M32 45 L42 36"/>
      <path d="M32 30 L25 21"/><path d="M32 30 L43 19"/><path d="M43 19 L52 9"/>
    </g>
    <g fill="#c6f24e">
      <circle cx="21" cy="35" r="2.6"/><circle cx="42" cy="36" r="2.6"/>
      <circle cx="25" cy="21" r="2.6"/><circle cx="43" cy="19" r="2.6"/>
    </g>
    <circle cx="52" cy="9" r="4" fill="#d4f76a"/>
  </g>
  <text x="208" y="150" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#fafafa">Fangorn <tspan fill="#c6f24e" font-style="italic">Market</tspan></text>
</svg>
