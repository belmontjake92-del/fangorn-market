<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="800" viewBox="0 0 2000 800" fill="none">
  <!-- Fangorn Market - article cover (2000x800, 5:2). The Grove as a living graph. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2000" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070808"/>
      <stop offset="1" stop-color="#0a1109"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#c6f24e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c6f24e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.32" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#6fa8c9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6fa8c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2000" height="800" fill="url(#bg)"/>
  <rect width="2000" height="800" fill="url(#glow)"/>
  <rect width="2000" height="800" fill="url(#glow2)"/>

  <!-- edges -->
  <g stroke="#c6f24e" stroke-width="2" opacity="0.32" stroke-linecap="round">
    <line x1="180" y1="640" x2="330" y2="560"/>
    <line x1="330" y1="560" x2="250" y2="450"/>
    <line x1="330" y1="560" x2="470" y2="530"/>
    <line x1="250" y1="450" x2="570" y2="410"/>
    <line x1="470" y1="530" x2="570" y2="410"/>
    <line x1="470" y1="530" x2="690" y2="480"/>
    <line x1="570" y1="410" x2="780" y2="340"/>
    <line x1="690" y1="480" x2="900" y2="430"/>
    <line x1="780" y1="340" x2="990" y2="300"/>
    <line x1="900" y1="430" x2="990" y2="300"/>
    <line x1="900" y1="430" x2="1130" y2="380"/>
    <line x1="990" y1="300" x2="1200" y2="250"/>
    <line x1="1130" y1="380" x2="1200" y2="250"/>
    <line x1="1130" y1="380" x2="1330" y2="330"/>
    <line x1="1200" y1="250" x2="1420" y2="210"/>
    <line x1="1330" y1="330" x2="1560" y2="270"/>
    <line x1="1420" y1="210" x2="1660" y2="160"/>
    <line x1="1560" y1="270" x2="1660" y2="160"/>
    <line x1="1560" y1="270" x2="1740" y2="320"/>
    <line x1="1660" y1="160" x2="1830" y2="220"/>
    <line x1="1740" y1="320" x2="1830" y2="220"/>
    <line x1="1830" y1="220" x2="1910" y2="120"/>
    <line x1="1660" y1="160" x2="1910" y2="120"/>
    <line x1="1420" y1="210" x2="1200" y2="250"/>
  </g>

  <!-- nodes -->
  <g fill="#c6f24e">
    <circle cx="180" cy="640" r="4" opacity="0.65"/>
    <circle cx="330" cy="560" r="5" opacity="0.7"/>
    <circle cx="250" cy="450" r="4" opacity="0.65"/>
    <circle cx="470" cy="530" r="5" opacity="0.7"/>
    <circle cx="570" cy="410" r="7"/>
    <circle cx="690" cy="480" r="4" opacity="0.65"/>
    <circle cx="780" cy="340" r="5" opacity="0.8"/>
    <circle cx="900" cy="430" r="4" opacity="0.7"/>
    <circle cx="990" cy="300" r="8"/>
    <circle cx="1130" cy="380" r="5" opacity="0.8"/>
    <circle cx="1200" cy="250" r="7"/>
    <circle cx="1330" cy="330" r="5" opacity="0.8"/>
    <circle cx="1420" cy="210" r="6"/>
    <circle cx="1560" cy="270" r="5" opacity="0.8"/>
    <circle cx="1660" cy="160" r="8"/>
    <circle cx="1740" cy="320" r="4" opacity="0.7"/>
