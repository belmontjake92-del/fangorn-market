# Fly.io config for Fangorn Market (app name is set by `fly launch`).
# If "fangorn-market" is taken globally, `fly launch` will prompt for another.
app = "fangorn-market"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # Run the always-on paper worker so agents keep trading around the clock.
  AGENT_WORKER = "1"
  WORKER_INTERVAL_MS = "180000"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running at all times so the agent worker never sleeps.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
