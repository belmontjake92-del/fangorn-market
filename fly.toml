# Fly.io config for Fangorn Market (app name is set by `fly launch`).
# If "fangorn-market" is taken globally, `fly launch` will prompt for another.
app = "fangorn-market"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle to stay cheap during onboarding; set
  # min_machines_running = 1 to remove cold starts once you have traffic.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
